<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8×8 Bitmap Font Library Viewer</title>
<!--
8x8 Bitmap Font Viewer
Author: Perplexity.AI — generated the main code,
Perplexity.AI — added the #toast code for the copy screen
-->
<style>
:root { color-scheme: dark; }
body { background:#202020; color:white; font-family:Consolas,monospace; margin:25px; }
h1 { color:#6ff; }
textarea { width:100%; height:280px; box-sizing:border-box; background:#111; color:#eee; border:1px solid #555; padding:10px; font:14px Consolas,monospace; }
button, input, select { font:inherit; }
button { padding:8px 12px; margin:4px 4px 4px 0; cursor:pointer; }
.controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:12px 0; }
input[type=range] { width:220px; }
#status { color:#ccc; margin:10px 0; }
#viewer { overflow:auto; background:#111; border:1px solid #555; padding:18px; min-height:150px; }
.library { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:24px 18px; align-items:start; }
.row { display:flex; align-items:center; gap:10px; }
.glyph { display:grid; grid-template-columns:repeat(8, var(--pixel)); grid-template-rows:repeat(8, var(--pixel)); gap:var(--gap); background:#555; padding:var(--gap); flex:none; }
.pixel { width:var(--pixel); height:var(--pixel); background:#222; }
.pixel.on { background:#eee; }
.label { color:#ccc; min-width:42px; white-space:pre; font-family:Consolas, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols2", "Arial Unicode MS", monospace; }
#message { color:#9f9; min-height:1.2em; }
</style>
</head>
<body>
<h1>8×8 Bitmap Font Library Viewer</h1>
<p>Paste your complete <code>LEDChar LEDfont[]</code> array, or any portion of it, below.</p>
<textarea id="source" spellcheck="false" placeholder="Paste C font data here..."></textarea>
<div class="controls">
  <button id="renderButton">Render library</button>
  <button id="clearButton">Clear</button>
  <label>Zoom: <input id="zoom" type="range" min="4" max="40" value="16"> <span id="zoomValue">16 px</span></label>
  <label>
    Columns:
    <select id="columns">
        <option value="auto">Automatic</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
    </select>
</label>
</div>
<div id="message"></div>
<div id="status">No characters loaded.</div>
<div id="viewer"><div id="library" class="library"></div></div>
<script>
const source = document.getElementById('source');
const library = document.getElementById('library');
const viewer = document.getElementById('viewer');
const status = document.getElementById('status');
const message = document.getElementById('message');
const zoom = document.getElementById('zoom');
const zoomValue = document.getElementById('zoomValue');
const columns = document.getElementById('columns');

function parseFont(text) {
  const result = [];
  const entryPattern =
    /\{\s*(['"])((?:\\x[0-9a-fA-F]{2}|\\u\{[0-9a-fA-F]+\}|\\u[0-9a-fA-F]{4}|\\.|(?!\1)[^\\])+)\1\s*,\s*\{([^{}]*)\}\s*\}\s*,?[ \t]*(?:\/\/([^\r\n]*))?/g;
  let match;
  while ((match = entryPattern.exec(text)) !== null) {
    const rawChar = match[2];
    const char = decodeString(match[2]);
    const comment = match[4] !== undefined ? match[4].trim() : '';
    const bytes = (match[3].match(/0[xX][0-9a-fA-F]+|\b\d+\b/g) || [])
      .map(value => value.toLowerCase().startsWith('0x') ? parseInt(value, 16) : parseInt(value, 10))
      .slice(0, 8);
    if (bytes.length === 8) result.push({ char, rawChar, comment, bytes });
  }
  return result;
}

function decodeString(value) {
  return value
    .replace(/\\x([0-9a-fA-F]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
    .replace(/\\u\{([0-9a-fA-F]+)\}/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
    .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
    .replace(/\\\\/g, '\u0000BS\u0000')
    .replace(/\\(.)/g, (_, c) => {
      switch (c) {
        case 'n': return '\n';
        case 'r': return '\r';
        case 't': return '\t';
        case '0': return '\0';
        default: return c; // unrecognized escapes (e.g. \{, \}, \#) fall back to the literal character
      }
    })
    .replace(/\u0000BS\u0000/g, '\\');
}

function render() {
  const chars = parseFont(source.value);
  library.innerHTML = '';
  library.style.gridTemplateColumns = columns.value === 'auto' ? 'repeat(auto-fill, minmax(150px, 1fr))' : `repeat(${columns.value}, minmax(120px, 1fr))`;
  for (const item of chars) {
    const row = document.createElement('div');
    row.className = 'row';
    const glyph = document.createElement('div');
    glyph.className = 'glyph';
    const label = item.rawChar === ' ' ? '[space]' : item.rawChar;
    const tooltip = item.comment || label;
    glyph.title = tooltip;
    item.bytes.forEach(byte => {
      for (let bit = 7; bit >= 0; bit--) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel' + ((byte & (1 << bit)) ? ' on' : '');
        glyph.appendChild(pixel);
      }
    });
    const labelDiv = document.createElement('div');
    labelDiv.className = 'label';
    labelDiv.textContent = label;
    row.append(glyph, labelDiv);
    library.appendChild(row);
  }
  status.textContent = chars.length ? `${chars.length} character${chars.length === 1 ? '' : 's'} loaded.` : 'No valid 8-byte character entries found.';
}

function updateZoom() {
  const size = `${zoom.value}px`;
  document.documentElement.style.setProperty('--pixel', size);
  document.documentElement.style.setProperty('--gap', `${Math.max(1, Math.round(Number(zoom.value) / 10))}px`);
  zoomValue.textContent = `${zoom.value} px`;
}

document.getElementById('renderButton').onclick = render;
document.getElementById('clearButton').onclick = () => { source.value = ''; library.innerHTML = ''; status.textContent = 'No characters loaded.'; message.textContent = ''; };
zoom.oninput = updateZoom;
columns.onchange = render;
updateZoom();
</script>
</body>
</html>
